# mpv — the DE's video player. Quiet flock polish: DE type on the OSD, the
# shell's dark grey behind letterboxing, sane resume behaviour. mpv's OSC is
# already decorationless, which is why it was chosen — keep it stock.

background-color="#1c1c1e"
osd-font="SF Pro Text"
osd-font-size=32
sub-font="SF Pro Text"
keep-open=yes
save-position-on-quit=yes
volume-max=150
