# mpv — the DE's video player. ewe polish: DE type on the OSD, the shell's
# surface behind letterboxing, sane resume behaviour, and the uosc controller
# (mpv-uosc-git) themed to the DE — colorscheme.sh writes theme.conf and
# script-opts/uosc.conf on every theme change (both gitignored runtime files).

include="~~/theme.conf"
osd-font="Ubuntu"
osd-font-size=32
sub-font="Ubuntu"
keep-open=yes
save-position-on-quit=yes
volume-max=150
