# ewe's portal routing (RFC-011). lib/deploy.sh links this folder to
# ~/.config/xdg-desktop-portal, which xdg-desktop-portal reads BEFORE the
# system's /usr/share/xdg-desktop-portal/hyprland-portals.conf (xdph's).
#
# Files and "Open with" go to ewe-portal: the shell draws one picker for every
# app, on top of the app that asked, and ewe-portal hands the request to the
# GTK dialog by itself when the shell can't answer. Everything else is the
# same as the stock file: Hyprland's portal first, then GTK's.
# Check it: `ewe-portal status` (routing.ewe = true).
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=ewe;gtk
org.freedesktop.impl.portal.AppChooser=ewe;gtk
