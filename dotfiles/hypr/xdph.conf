# xdg-desktop-portal-hyprland config (~/.config/hypr/xdph.conf).
# The screen-share picker is OURS: a themed Quickshell dialog with live
# previews of every monitor and window (SharePicker.qml), in place of the stock
# white Qt list of connector names. The wrapper is installed to /usr/local/bin
# by phase 30 (xdph exec()s this path verbatim — no shell, no ~) and falls back
# to hyprland-share-picker whenever the shell isn't running.
# Applies after: systemctl --user restart xdg-desktop-portal-hyprland
#
# The portal PACKAGE matters too: xdph 1.4.1 freezes a screen share for good
# the first time its consumer returns a buffer late (upstream #424/#425, fixed
# after the release). ewe installs 1.4.1-1.1 with those fixes from
# packages/patched/ until the repos ship them.
screencopy {
    custom_picker_binary = /usr/local/bin/ewe-share-picker
    max_fps = 60
}
