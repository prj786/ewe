# hypridle — idle management. hypridle owns the TIMING; the shell owns what each
# stage looks like (the dim overlay, the screensaver, the lock surface).
# (Lid-close behaviour is handled by lid.sh → Lid.qml, not here.)
#
# This is the fallback default. Once the Settings → Screensaver pane has been
# touched, ~/.config/hypr/generated/hypridle.conf supersedes it — and that
# generated file also shortens every stage while on battery, which a static file
# cannot do.

general {
    lock_cmd         = qs ipc call lock lock          # catches `loginctl lock-session`
    # Fallback only: the shell's logind delay inhibitor (Logind.qml) is what
    # locks before suspend now, with a handshake instead of a race. Locking
    # twice is idempotent, so keeping hypridle's belt beside our braces is free.
    before_sleep_cmd = qs ipc call lock lock
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_dbus_inhibit = false
}

# 4m40s idle → dim. The grace period made visible: the screen fades down a
# little before anything irreversible happens, and any input clears it. The
# overlay is click-through, so it can never swallow the input cancelling it.
listener {
    timeout    = 280
    on-timeout = qs ipc call saver dim
    on-resume  = qs ipc call saver undim
}

# 5 min idle → lock
listener {
    timeout    = 300
    on-timeout = qs ipc call lock lock
    on-resume  = qs ipc call saver undim
}

# 15 min idle → suspend, but ONLY on a laptop running on battery (idle-suspend.sh
# no-ops on a desktop or while plugged in). before_sleep_cmd locks first. Desktop
# users — or anyone who doesn't want idle-suspend — can delete this listener.
listener {
    timeout    = 900
    on-timeout = ~/.config/hypr/scripts/idle-suspend.sh
}

# NOTE: no dpms-off listener on purpose. The Lunar Lake `xe` GPU has a known
# DPMS-resume bug that can leave the panel black and unwakeable, so we lock but
# never power the panel fully off. Re-add a `dpms off` listener here if a fix
# lands upstream (the Settings → Displays pane is the place to surface a toggle).
