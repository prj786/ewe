# kitty — the one terminal for ewe. Themed to the DE palette: flock
# chrome (Theme.qml) + Gruvbox ANSI colours (colors.lua) for command/code output.
# Accent-follow colours (cursor, tabs, selection) are overridden by flock.conf,
# generated by colorscheme.sh — the values below are only the fallback.

# ── font ──────────────────────────────────────────────────────────────────────
# Geist Mono, the design system's code face (Typography); Georgian falls back
# to Noto Sans Georgian through dotfiles/fontconfig. Geist Mono has no Nerd
# glyphs, so the private-use area (the oh-my-posh prompt) maps to the Nerd
# symbols font (ttf-nerd-fonts-symbols-mono).
font_family      Geist Mono
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures never

# ── window / chrome ─────────────────────────────────────────────────────────
window_padding_width   8
background_opacity      0.95
confirm_os_window_close 0
cursor_shape            beam
cursor_blink_interval   0
scrollback_lines        20000
enable_audio_bell       no
# Hyprland draws the border + does the blur; kitty stays borderless.
hide_window_decorations yes

# ── tab bar (graphite, accent active tab; the generated flock.conf wins) ───────────────────────────────
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted
active_tab_background   #eeb407
active_tab_foreground   #0b0a08
active_tab_font_style   bold
inactive_tab_background #1d1d1f
inactive_tab_foreground #8e8e93

# ── base colours (graphite chrome) ───────────────────────────────────────────
foreground            #f2f2f7
background            #1c1c1e
selection_foreground  #ffffff
selection_background  #14345f
cursor                #eeb407
cursor_text_color     #1c1c1e
url_color             #eeb407

# ── ANSI palette (Gruvbox — colours command output + TUIs to the DE scheme) ──
color0  #282828
color8  #928374
color1  #cc241d
color9  #fb4934
color2  #98971a
color10 #b8bb26
color3  #d79921
color11 #fabd2f
color4  #458588
color12 #83a598
color5  #b16286
color13 #d3869b
color6  #689d6a
color14 #8ec07c
color7  #a89984
color15 #ebdbb2

# No multiplexer wrapper. kitty launches the login shell directly; the prompt
# is oh-my-posh (dotfiles/oh-my-posh/, wired into the rc files by phase 60).
# Hyprland already provides windows, tabs and workspaces, so wrapping every
# terminal in a second window manager bought little and surprised people who
# expected a plain shell.

# ── accent-follow overrides — GENERATED by scripts/colorscheme.sh; a missing
#    file just leaves the fallbacks above (kitty warns once, harmlessly) ──────
include flock.conf
