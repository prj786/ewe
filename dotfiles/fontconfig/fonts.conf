<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ewe — font fallback policy.

     The DE face is Inter (inter-font), which has no Georgian glyphs; without
     this file Georgian text falls to whatever fc-match picks first, which is
     why it looked ugly. Prefer Noto Sans Georgian explicitly so Latin renders
     in Inter and Georgian in a matched humanist face. Monospace is the Nerd
     Font build of JetBrains Mono (ttf-jetbrains-mono-nerd), as in kitty. -->
<fontconfig>
  <alias>
    <family>Inter</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans Georgian</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans Georgian</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
