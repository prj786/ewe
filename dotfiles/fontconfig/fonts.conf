<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ewe — fonts and fallback policy (design system v3, Typography).

     Interface text is Geist, code is Geist Mono. Neither is in the Arch
     repos, so the variable fonts (OFL, from design/system/fonts/) ship in
     dotfiles/quickshell/fonts/geist/ and this file adds that folder to the font
     path: `relative` resolves against this file, which sits beside
     quickshell/ both in the repo and as ~/.config/fontconfig. Only the
     geist/ subfolder: Lucide (fonts/Lucide.ttf, loaded by Theme.qml) is
     private-use glyphs and must not become a system-wide fallback that
     beats the Nerd symbols in the terminal.

     Geist has no Georgian glyphs, so both stacks prefer Noto Sans Georgian
     (noto-fonts) next; without this, Georgian falls to whatever fc-match
     picks first. Inter (inter-font) keeps its own alias for anything that
     still names it. -->
<fontconfig>
  <dir prefix="relative">../quickshell/fonts/geist</dir>

  <alias>
    <family>Geist</family>
    <prefer>
      <family>Geist</family>
      <family>Noto Sans Georgian</family>
    </prefer>
  </alias>
  <alias>
    <family>Geist Mono</family>
    <prefer>
      <family>Geist Mono</family>
      <family>Noto Sans Georgian</family>
    </prefer>
  </alias>
  <alias>
    <family>Inter</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans Georgian</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Geist</family>
      <family>Noto Sans Georgian</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Geist Mono</family>
      <family>Noto Sans Georgian</family>
    </prefer>
  </alias>
</fontconfig>
