<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ewe — font fallback policy.

     The DE face is Ubuntu (ttf-ubuntu-font-family), which has no Georgian
     glyphs; without this file Georgian text falls to whatever fc-match picks
     first, which is why it looked ugly. Prefer Noto Sans Georgian explicitly
     so Latin renders in Ubuntu and Georgian in a matched humanist face. -->
<fontconfig>
  <alias>
    <family>Ubuntu</family>
    <prefer>
      <family>Ubuntu</family>
      <family>Noto Sans Georgian</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Ubuntu</family>
      <family>Noto Sans Georgian</family>
    </prefer>
  </alias>
</fontconfig>
