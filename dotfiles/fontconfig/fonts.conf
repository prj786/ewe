<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ewe — fonts and fallback policy (design system v3, Typography).

     Interface text is Geist, code is Geist Mono. Neither is in the Arch
     repos, so the variable fonts (OFL, from design/system/fonts/) ship in
     dotfiles/quickshell/fonts/geist/ and this file adds that folder to the font
     path: `relative` resolves against this file, which sits beside
     quickshell/ both in the repo and as ~/.config/fontconfig. Only the
     geist/ subfolder: Lucide (fonts/Lucide.ttf, loaded by Theme.qml) is
     private-use glyphs and must not become a system-wide fallback that
     beats the Nerd symbols in the terminal.

     Geist has no Georgian glyphs, so both stacks prefer Noto Sans Georgian
     (noto-fonts) next; without this, Georgian falls to whatever fc-match
     picks first.

     Chinese, Japanese and Korean come from Source Han Sans
     (adobe-source-han-sans-otc-fonts, packages/common.list; the same design
     as Noto Sans CJK). Until 2026-11-08 no CJK font was installed at all and
     those scripts drew as empty boxes. One file holds every region; a Han
     character is drawn the way its reader expects, so the stacks name
     Simplified Chinese (SC) and the rules at the end put the Japanese, Korean,
     Traditional (Taiwan) or Hong Kong cut first when the text's language says
     so. Monospace names the same cuts (a terminal draws Latin from Geist Mono
     and borrows only the CJK glyphs, full width in every cut), but there
     fontconfig 2.18 prefers the one cut it classes as monospace, the
     half-width SC, whatever the language: kana and hangul are right, a
     shared Han character keeps its Simplified shape. -->
<fontconfig>
  <dir prefix="relative">../quickshell/fonts/geist</dir>

  <alias>
    <family>Geist</family>
    <prefer>
      <family>Geist</family>
      <family>Noto Sans Georgian</family>
      <family>Source Han Sans SC</family>
    </prefer>
  </alias>
  <alias>
    <family>Geist Mono</family>
    <prefer>
      <family>Geist Mono</family>
      <family>Noto Sans Georgian</family>
      <family>Source Han Sans SC</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Geist</family>
      <family>Noto Sans Georgian</family>
      <family>Source Han Sans SC</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Geist Mono</family>
      <family>Noto Sans Georgian</family>
      <family>Source Han Sans SC</family>
    </prefer>
  </alias>
  <!-- the regional cut before the Simplified one, by the text's language -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>Source Han Sans SC</string></test>
    <edit name="family" mode="prepend"><string>Source Han Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>Source Han Sans SC</string></test>
    <edit name="family" mode="prepend"><string>Source Han Sans K</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>Source Han Sans SC</string></test>
    <edit name="family" mode="prepend"><string>Source Han Sans TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>Source Han Sans SC</string></test>
    <edit name="family" mode="prepend"><string>Source Han Sans HC</string></edit>
  </match>
</fontconfig>
