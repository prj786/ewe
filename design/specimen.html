<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ewe Theme Specimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono&display=swap">
<style>
/* AUTO-GENERATED by `ewe-theme build` from ewe-theme.conf.
 * Do not edit by hand — change the conf and rebuild.
 *
 * Every name here mirrors a token in dotfiles/quickshell/Theme.qml, so the
 * shell and the apps are demonstrably the same system. The default theme is
 * :root; every other theme is .dark.<name>, the class App.svelte toggles.
 *
 * --accent is the user's pick, injected inline at runtime, which beats any
 * rule here. What IS themed is --accent-default: the colour a look opens
 * with before anyone chooses, chained as `--accent: var(--accent-default)`.
 * The font stack is shared by both looks and never themed.
 */

/* Flock — Bauhaus — bold, raw, unapologetic. Square, thick-ruled, uppercase. */
:root {
  --bg: #14140f;
  --panel: #1c1b15;
  --elevated: #24231b;
  --hover: #2f2d22;
  --stroke: #f5f0e8;
  --fg: #f5f0e8;
  --fg-secondary: #b8b2a4;
  --fg-dim: #8a8478;
  --success: #4d84ff;
  --warning: #ffcc00;
  --danger: #e63b2e;
  --link: #4d84ff;
  --link-solid: #0055ff;
  --accent-fg: #14140f;
  --radius: 0px;
  --radius-inner: 0px;
  --radius-pill: 0px;
  --border: 3px;
  --border-thin: 2px;
  --shadow-offset: 4px;
  --label-transform: uppercase;
  --label-tracking: 0.06em;
  --label-weight: 700;
  --btn-hover-bg: transparent;
  --btn-hover-fg: var(--accent);
  --input-border-width: 0 0 3px 0;
  --accent-default: #ffcc00;
  --elevation: 4px 4px 0 0 #000000;
  --elevation-sm: 2px 2px 0 0 #000000;
  --accent: var(--accent-default);
}

/* Black Sheep — Alexandria — serene, tonal, soft-cornered. For deep-focus work. */
.dark.blacksheep {
  --bg: #121314;
  --panel: #1b1c1d;
  --elevated: #1f2021;
  --hover: #292a2b;
  --stroke: #434653;
  --fg: #e3e2e3;
  --fg-secondary: #c3c6d5;
  --fg-dim: #8d909e;
  --success: #a6d6a8;
  --warning: #dcc661;
  --danger: #ffb4ab;
  --link: #b1c5ff;
  --link-solid: #3366cc;
  --accent-fg: #002c70;
  --radius: 12px;
  --radius-inner: 8px;
  --radius-pill: 6px;
  --border: 1px;
  --border-thin: 1px;
  --shadow-offset: 0px;
  --label-transform: none;
  --label-tracking: normal;
  --label-weight: 500;
  --btn-hover-bg: color-mix(in srgb, var(--accent) 88%, #ffffff);
  --btn-hover-fg: var(--accent-fg);
  --input-border-width: 1px;
  --accent-default: #b1c5ff;
  --elevation: 0 8px 24px rgba(0, 0, 0, 0.45);
  --elevation-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
  --accent: var(--accent-default);
}

* { box-sizing: border-box; }
body { margin:0; font-family: Ubuntu, "Noto Sans Georgian", Cantarell, system-ui, sans-serif; background: var(--bg); color: var(--fg);
       transition: background .15s, color .15s; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 28px 24px 64px; }
h1 { font-size: 22px; margin: 0 0 2px; font-weight: var(--label-weight);
     text-transform: var(--label-transform); letter-spacing: var(--label-tracking); }
.sub { color: var(--fg-dim); font-size: 13px; margin-bottom: 22px; }
h2 { font-size: 11px; color: var(--fg-dim); margin: 30px 0 10px; font-weight: var(--label-weight);
     text-transform: var(--label-transform); letter-spacing: var(--label-tracking); }
.card { background: var(--panel); border: var(--border) solid var(--stroke);
        border-radius: var(--radius); box-shadow: var(--elevation); padding: 18px; }
.row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
.btn { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; padding:7px 14px;
       font: inherit; font-size:13px; cursor:pointer; border-radius: var(--radius-pill);
       border: var(--border) solid transparent; font-weight: var(--label-weight);
       letter-spacing: var(--label-tracking); text-transform: var(--label-transform); }
.btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn-primary:hover { background: var(--btn-hover-bg); color: var(--btn-hover-fg); }
.btn-ghost { background: var(--elevated); color: var(--fg); border-color: var(--stroke); }
.btn-ghost:hover { background: var(--hover); }
.btn-danger { background: var(--danger); color: var(--accent-fg); border-color: var(--danger); }
.btn[disabled] { opacity:.45; pointer-events:none; }
input.f { width:100%; padding:8px 12px; font:inherit; font-size:13px; background: var(--elevated);
          color: var(--fg); border-radius: var(--radius-inner); border-style: solid;
          border-color: var(--stroke); border-width: var(--input-border-width); outline:none; }
input.f:focus { border-color: var(--accent); }
input.f::placeholder { color: var(--fg-dim); }
.kv { display:flex; justify-content:space-between; padding:9px 14px; font-size:13px;
      border-top: var(--border-thin) solid var(--stroke); }
.sw { width:38px; height:20px; border-radius: var(--radius-pill); position:relative; cursor:pointer;
      border: var(--border-thin) solid var(--stroke); background: var(--elevated); }
.sw.on { background: var(--accent); border-color: var(--accent); }
.sw i { position:absolute; top:1px; left:2px; width:14px; height:14px; border-radius: var(--radius-pill);
        background: var(--fg-dim); transition:left .12s; }
.sw.on i { left:19px; background: var(--accent-fg); }
.track { height:6px; background: var(--elevated); border-radius: var(--radius-pill); overflow:hidden;
         border: var(--border-thin) solid var(--stroke); }
.track > b { display:block; height:100%; width:64%; background: var(--accent); }
.chip { display:inline-block; padding:3px 9px; font-size:11px; border-radius: var(--radius-pill);
        border: var(--border-thin) solid currentColor; }
.sw-list { display:grid; grid-template-columns: repeat(auto-fill,minmax(132px,1fr)); gap:10px; }
.sw-list div { border: var(--border-thin) solid var(--stroke); border-radius: var(--radius-inner);
               padding:8px; font-size:10px; font-family: "Ubuntu Mono", ui-monospace, monospace; color: var(--fg-dim); }
.sw-list span { display:block; height:36px; border-radius: var(--radius-pill); margin-bottom:6px;
                border: var(--border-thin) solid var(--stroke); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.picker { position:sticky; top:0; background: var(--bg); padding:14px 0; display:flex; gap:8px;
          border-bottom: var(--border-thin) solid var(--stroke); margin-bottom:8px; z-index:2; }
</style>
<body>
<div class="wrap">
  <div class="picker"><button class="btn btn-ghost" data-t="flock">Flock</button><button class="btn btn-ghost" data-t="blacksheep">Black Sheep</button></div>
  <h1 id="tl"></h1><div class="sub" id="tn"></div>

  <h2>Buttons — states</h2>
  <div class="card"><div class="row">
    <button class="btn btn-primary">Save changes</button>
    <button class="btn btn-ghost">Secondary</button>
    <button class="btn btn-danger">Discard</button>
    <button class="btn btn-ghost" disabled>Disabled</button>
    <span class="chip" style="color:var(--success)">Connected</span>
    <span class="chip" style="color:var(--warning)">Pending</span>
    <span class="chip" style="color:var(--danger)">Failed</span>
  </div></div>

  <h2>Input · toggle · slider</h2>
  <div class="card">
    <input class="f" placeholder="https://cloud.example.org">
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <span style="font-size:13px">Auto-sync</span><div class="sw on"><i></i></div></div>
    <div class="row" style="margin-top:10px;justify-content:space-between">
      <span style="font-size:13px;color:var(--fg-dim)">Glass translucency</span><div class="sw"><i></i></div></div>
    <div style="margin-top:16px"><div class="track"><b></b></div></div>
  </div>

  <h2>Card — content rows</h2>
  <div class="card" style="padding:0">
    <div style="padding:14px 14px 10px"><div style="font-size:15px;font-weight:600">Scubba</div>
      <div style="font-size:12px;color:var(--fg-dim)">scubba@tab.digital</div></div>
    <div class="kv"><span style="color:var(--fg-dim)">Storage</span><span>1.2 GB of 5.0 GB</span></div>
    <div class="kv"><span style="color:var(--fg-dim)">Last synced</span><span>2 Sep, 15:04</span></div>
    <div class="kv"><span style="color:var(--fg-dim)">Link colour</span><span style="color:var(--link)">a link</span></div>
  </div>

  <h2>Palette</h2>
  <div class="card"><div class="sw-list" id="sw"></div></div>
</div>
<script>
const T = {"flock": {"label": "Flock", "note": "Bauhaus \u2014 bold, raw, unapologetic. Square, thick-ruled, uppercase.", "color": {"bg": "#14140f", "panel": "#1c1b15", "elevated": "#24231b", "hover": "#2f2d22", "stroke": "#f5f0e8", "fg": "#f5f0e8", "fg-secondary": "#b8b2a4", "fg-dim": "#8a8478", "success": "#4d84ff", "warning": "#ffcc00", "danger": "#e63b2e", "link": "#4d84ff", "link-solid": "#0055ff", "accent-fg": "#14140f"}, "accent": "#ffcc00"}, "blacksheep": {"label": "Black Sheep", "note": "Alexandria \u2014 serene, tonal, soft-cornered. For deep-focus work.", "color": {"bg": "#121314", "panel": "#1b1c1d", "elevated": "#1f2021", "hover": "#292a2b", "stroke": "#434653", "fg": "#e3e2e3", "fg-secondary": "#c3c6d5", "fg-dim": "#8d909e", "success": "#a6d6a8", "warning": "#dcc661", "danger": "#ffb4ab", "link": "#b1c5ff", "link-solid": "#3366cc", "accent-fg": "#002c70"}, "accent": "#b1c5ff"}}, DEF = "flock";
function apply(name) {
  const t = T[name];
  document.documentElement.className = name === DEF ? "" : "dark " + name;
  document.documentElement.classList.add("dark");
  document.documentElement.style.setProperty("--accent", t.accent);
  document.getElementById("tl").textContent = t.label;
  document.getElementById("tn").textContent = t.note;
  const c = getComputedStyle(document.documentElement);
  document.getElementById("sw").innerHTML = Object.entries(T[name].color)
    .map(([k, v]) => `<div><span style="background:${v}"></span>--${k}<br>${v}</div>`).join("");
  document.querySelectorAll(".picker button").forEach(b =>
    b.className = "btn " + (b.dataset.t === name ? "btn-primary" : "btn-ghost"));
}
document.querySelectorAll(".picker button").forEach(b =>
  b.onclick = () => apply(b.dataset.t));
apply(DEF);
</script>
