<!doctype html>
<html>
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||"dark"</script><style>body{background:var(--surface-base);color:var(--text-primary);font-family:var(--font-sans)}</style><meta charset="utf-8"><title>Progress bar — preview</title><style>html,body{margin:0}</style></head>
<body>
<div class="ds-sheet">
<section class="ds-block"><div class="ds-title">Default · 4px</div><div style="display:flex;flex-direction:column;gap:16px"><div class="ewe-progress" style="width:320px" role="progressbar"><div class="ewe-progress__track"><div class="ewe-progress__fill" style="--value:0%"></div></div></div><div class="ewe-progress" style="width:320px" role="progressbar"><div class="ewe-progress__track"><div class="ewe-progress__fill" style="--value:35%"></div></div></div><div class="ewe-progress" style="width:320px" role="progressbar"><div class="ewe-progress__track"><div class="ewe-progress__fill" style="--value:100%"></div></div></div></div></section><section class="ds-block"><div class="ds-title">With label and value</div><div style="display:flex;flex-direction:column;gap:16px"><div class="ewe-progress" style="width:320px" role="progressbar"><div class="ewe-progress__head"><span class="ewe-progress__label">Downloading linux-zen</span><span class="ewe-progress__value">62%</span></div><div class="ewe-progress__track"><div class="ewe-progress__fill" style="--value:62%"></div></div><span class="ewe-progress__hint">84.2 MB of 136 MB · 12 s left</span></div><div class="ewe-progress ewe-progress--success" style="width:320px" role="progressbar"><div class="ewe-progress__head"><span class="ewe-progress__label">Update complete</span><span class="ewe-progress__value">100%</span></div><div class="ewe-progress__track"><div class="ewe-progress__fill" style="--value:100%"></div></div></div><div class="ewe-progress ewe-progress--danger" style="width:320px" role="progressbar"><div class="ewe-progress__head"><span class="ewe-progress__label">Installation failed</span><span class="ewe-progress__value">48%</span></div><div class="ewe-progress__track"><div class="ewe-progress__fill" style="--value:48%"></div></div><span class="ewe-progress__hint">Disk is full. Free up 2.1 GB and try again.</span></div></div></section><section class="ds-block"><div class="ds-title">Large · 8px</div><div class="ewe-progress ewe-progress--lg" style="width:320px" role="progressbar"><div class="ewe-progress__head"><span class="ewe-progress__label">Battery</span><span class="ewe-progress__value">72%</span></div><div class="ewe-progress__track"><div class="ewe-progress__fill" style="--value:72%"></div></div></div></section><section class="ds-block"><div class="ds-title">Indeterminate</div><div class="ewe-progress ewe-progress--indeterminate" style="width:320px" role="progressbar"><div class="ewe-progress__head"><span class="ewe-progress__label">Preparing…</span><span class="ewe-progress__value"></span></div><div class="ewe-progress__track"><div class="ewe-progress__fill" style="--value:0%"></div></div></div></section><section class="ds-block"><div class="ds-title">Neutral, in a panel</div><div class="ds-panel" style="width:320px;display:flex;flex-direction:column;gap:12px"><div class="ewe-progress ewe-progress--neutral" style="width:304px" role="progressbar"><div class="ewe-progress__head"><span class="ewe-progress__label">Disk · /</span><span class="ewe-progress__value">41%</span></div><div class="ewe-progress__track"><div class="ewe-progress__fill" style="--value:41%"></div></div></div><div class="ewe-progress ewe-progress--neutral" style="width:304px" role="progressbar"><div class="ewe-progress__head"><span class="ewe-progress__label">Memory</span><span class="ewe-progress__value">12.4 GB</span></div><div class="ewe-progress__track"><div class="ewe-progress__fill" style="--value:78%"></div></div></div></div></section>
</div>
</body>
</html>
