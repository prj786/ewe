<!doctype html>
<html>
<head><meta charset="utf-8"><title>Date and time picker — preview</title><style>html,body{margin:0}</style></head>
<body>
<div class="ds-sheet">
<section class="ds-block"><div class="ds-title">Date with calendar</div><div style="display:flex;flex-direction:column;gap:4px;width:260px"><div class="ewe-field" style="width:200px"><div class="ewe-field__label"><span>Start date</span></div><div class="ewe-input is-focus" style="width:200px"><svg class="ewe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3" /><path d="M16 2v3" /><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18" /></svg><span class="ewe-input__text">17 Sep 2026</span></div></div><div class="ewe-popover" style="width:240px;padding:8px"><div class="ewe-cal"><div class="ewe-cal__head"><span class="ewe-cal__month">September 2026</span><button class="ewe-iconbtn ewe-iconbtn--ghost ewe-iconbtn--sm" aria-label="chevron-left"><svg class="ewe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></button><button class="ewe-iconbtn ewe-iconbtn--ghost ewe-iconbtn--sm" aria-label="chevron-right"><svg class="ewe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg></button></div><div class="ewe-cal__grid"><span class="ewe-cal__dow">Mo</span><span class="ewe-cal__dow">Tu</span><span class="ewe-cal__dow">We</span><span class="ewe-cal__dow">Th</span><span class="ewe-cal__dow">Fr</span><span class="ewe-cal__dow">Sa</span><span class="ewe-cal__dow">Su</span><span class="ewe-cal__day is-outside">31</span><span class="ewe-cal__day ">1</span><span class="ewe-cal__day ">2</span><span class="ewe-cal__day  has-event">3</span><span class="ewe-cal__day ">4</span><span class="ewe-cal__day  is-weekend">5</span><span class="ewe-cal__day  is-weekend">6</span><span class="ewe-cal__day ">7</span><span class="ewe-cal__day ">8</span><span class="ewe-cal__day  is-hover">9</span><span class="ewe-cal__day ">10</span><span class="ewe-cal__day ">11</span><span class="ewe-cal__day  is-weekend has-event">12</span><span class="ewe-cal__day  is-weekend">13</span><span class="ewe-cal__day ">14</span><span class="ewe-cal__day ">15</span><span class="ewe-cal__day ">16</span><span class="ewe-cal__day  is-today is-selected has-event">17</span><span class="ewe-cal__day ">18</span><span class="ewe-cal__day  is-weekend">19</span><span class="ewe-cal__day  is-weekend">20</span><span class="ewe-cal__day ">21</span><span class="ewe-cal__day ">22</span><span class="ewe-cal__day ">23</span><span class="ewe-cal__day  has-event">24</span><span class="ewe-cal__day ">25</span><span class="ewe-cal__day  is-weekend">26</span><span class="ewe-cal__day  is-weekend">27</span><span class="ewe-cal__day ">28</span><span class="ewe-cal__day ">29</span><span class="ewe-cal__day ">30</span><span class="ewe-cal__day is-outside">1</span><span class="ewe-cal__day is-outside">2</span><span class="ewe-cal__day is-outside">3</span><span class="ewe-cal__day is-outside">4</span></div></div></div></div></section><section class="ds-block"><div class="ds-title">Time</div><div class="ds-row" style="gap:16px;align-items:flex-start"><div class="ds-stack"><div class="ewe-input" style="width:120px"><svg class="ewe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg><span class="ewe-time"><span class="ewe-time__seg">20</span><span class="ewe-time__sep">:</span><span class="ewe-time__seg">00</span></span></div><span class="ds-cap">Default</span></div><div class="ds-stack"><div class="ewe-input" style="width:120px"><svg class="ewe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg><span class="ewe-time"><span class="ewe-time__seg is-focus">07</span><span class="ewe-time__sep">:</span><span class="ewe-time__seg">30</span></span></div><span class="ds-cap">Editing hours</span></div><div class="ds-stack"><div class="ewe-input" style="width:120px"><svg class="ewe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg><span class="ewe-time"><span class="ewe-time__seg">07</span><span class="ewe-time__sep">:</span><span class="ewe-time__seg is-focus">30</span></span></div><span class="ds-cap">Editing minutes</span></div></div></section><section class="ds-block"><div class="ds-title">Range, for the night light schedule</div><div class="ds-row" style="gap:16px;align-items:flex-start"><div class="ewe-field" style="width:120px"><div class="ewe-field__label"><span>From</span></div><div class="ewe-input" style="width:120px"><svg class="ewe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg><span class="ewe-time"><span class="ewe-time__seg">20</span><span class="ewe-time__sep">:</span><span class="ewe-time__seg">00</span></span></div></div><div class="ewe-field" style="width:120px"><div class="ewe-field__label"><span>To</span></div><div class="ewe-input" style="width:120px"><svg class="ewe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg><span class="ewe-time"><span class="ewe-time__seg">07</span><span class="ewe-time__sep">:</span><span class="ewe-time__seg">00</span></span></div></div><div class="ewe-field__helper" style="align-self:flex-end;padding-bottom:6px">11 h · ends tomorrow</div></div></section>
</div>
</body>
</html>
