<!-- @dsCard group="Shell" height=300 subtitle="The focused workspace number at the start of the bar" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Workspace indicator — preview</title><style>html,body{margin:0}</style></head>
<body>
<div class="ds-sheet">
<section class="ds-block"><div class="ds-title">Workspace chip</div><div class="ds-row" style="gap:16px;align-items:flex-end"><div class="ds-stack"><span class="ewe-wschip ">1</span><span class="ds-cap">Default</span></div><div class="ds-stack"><span class="ewe-wschip is-hover">1</span><span class="ds-cap">Hover</span></div><div class="ds-stack"><span class="ewe-wschip is-open">1</span><span class="ds-cap">Overview open</span></div><div class="ds-stack"><span class="ewe-wschip is-focus">1</span><span class="ds-cap">Focus</span></div><div class="ds-stack"><span class="ewe-wschip ">12</span><span class="ds-cap">Two digits</span></div><div class="ds-stack"><div class="ewe-bar ewe-bar--lg" style="height:auto;padding:0;border:0;background:none"><span class="ewe-wschip ">3</span></div><span class="ds-cap">Large bar</span></div></div></section><section class="ds-block"><div class="ds-title">In the bar</div><div class="ewe-bar" style="width:420px;border:1px solid var(--border-subtle);border-radius:10px"><div class="ewe-bar__zone"><span class="ewe-wschip ">3</span><span class="ewe-bar__app"><span class="ewe-appicon " style="--app:var(--surface-sunken);--app-ink:var(--text-primary)"><svg class="ewe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19h8" /><path d="m4 17 6-6-6-6" /></svg></span>Kitty</span></div></div></section>
</div>
</body>
</html>
