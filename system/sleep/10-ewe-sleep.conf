# Installed to /etc/systemd/sleep.conf.d/ by ewe phase 32.
#
# Every sleep entry point in the DE (lid close, long idle, Quick Settings)
# funnels through zzz.sh = suspend-then-hibernate. This sets the second half of
# that verb: stay in s2idle this long, then surface once and hibernate to disk.
#
# 2 h means an afternoon lid-close never touches the disk (instant resume), but
# a laptop left shut overnight or in a bag costs ~2 h of s2idle drain and then
# nothing — instead of 20+ h of s2idle eating the whole battery.
[Sleep]
HibernateDelaySec=2h
