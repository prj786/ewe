# Installed to /etc/systemd/logind.conf.d/ by ewe phase 30.
#
# Lid: the SHELL owns clamshell policy while it is running (Lid.qml: external
# monitor connected → laptop panel off, keep working; laptop alone → sleep).
# It asserts that ownership by holding a `handle-lid-switch` block inhibitor
# (logind-bridge.py) for the whole session — so the `suspend` below never
# fires while the shell is alive and there is no race between two suspend
# paths. Everywhere the shell is NOT alive — the greeter, a bare TTY, a
# crashed shell — logind is the fallback and a closed lid must still sleep
# the machine (2026-08-17: lid closed at the greeter, nothing happened,
# machine sat open-eyed in the dark). Docked stays `ignore` even as fallback:
# >1 display connected means clamshell use, and blanking policy without the
# shell is worse than doing nothing.
#
# Power key: logind's default is an IMMEDIATE poweroff on a single tap — one
# stray press kills the whole session. Ignore it here; the shell binds
# XF86PowerOff to a themed shutdown confirmation instead (hyprland.lua →
# quicksettings powerdialog). A LONG press still powers off via logind as the
# escape hatch when the session is hung.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
