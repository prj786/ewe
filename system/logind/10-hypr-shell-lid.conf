# Installed to /etc/systemd/logind.conf.d/ by ewe phase 30.
#
# Lid: Hyprland owns it (scripts/lid.sh): external monitor connected → laptop
# panel off, keep working; laptop alone → lock + suspend. logind must NOT also
# act on the lid or the two suspend paths race.
#
# Power key: logind's default is an IMMEDIATE poweroff on a single tap — one
# stray press kills the whole session. Ignore it here; the shell binds
# XF86PowerOff to a themed shutdown confirmation instead (hyprland.lua →
# quicksettings powerdialog). A LONG press still powers off via logind as the
# escape hatch when the session is hung.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
