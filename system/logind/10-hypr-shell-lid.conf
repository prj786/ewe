# Installed to /etc/systemd/logind.conf.d/ by hypr-shell phase 30.
# Hyprland owns the lid (scripts/lid.sh): external monitor connected → laptop
# panel off, keep working; laptop alone → lock + suspend. logind must NOT also
# act on the lid or the two suspend paths race.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
