# Installed to /etc/systemd/system/systemd-logind.service.d/ by ewe phase 32,
# only when the hibernate swapfile lives under /home.
#
# logind ships with ProtectHome=yes, which makes /home LITERALLY INVISIBLE
# inside its mount namespace. Its hibernate feasibility check stats the swap
# entries from /proc/swaps, so /home/.swapfile comes back ENOENT and every
# CanHibernate / suspend-then-hibernate request is refused — zzz.sh then
# silently fell back to plain suspend (observed: all-night s2idle instead of
# the 2 h hibernate handoff, 2026-08-15). read-only is all it needs: logind
# only ever stats and reads the file, the kernel does the actual writing.
[Service]
ProtectHome=read-only
