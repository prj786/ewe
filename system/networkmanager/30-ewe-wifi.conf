# ewe — Wi-Fi stays awake (installed by phase 30 into
# /etc/NetworkManager/conf.d/). With 802.11 power saving on, the radio sleeps
# between the router's beacons and packets wait for it: a terminal over SSH
# feels sticky, and a call stutters, on a network that is fine. ewe is often
# one end of a remote session, so a connected laptop keeps its radio awake; it
# costs a little battery while connected. Read when a Wi-Fi network connects.
# A profile's own `wifi.powersave` still wins. Value 2 = disable.
[connection-ewe-wifi]
match-device=type:wifi
wifi.powersave=2
