# ewe — a cable keeps asking for an address (installed by phase 30 into
# /etc/NetworkManager/conf.d/). NetworkManager's default gives DHCP 45 s, calls
# the attempt failed (ip-config-unavailable), retries, and after four failures
# BLOCKS the connection for ~5 minutes — the port has link, nothing asks for an
# address, and the desktop shows nothing useful. On the owner's work desktop
# (Intel igc, 2026-10-28) the switch's DHCP answered late after every reboot:
# carrier at 100 Mb/s, a failure every 45 s, then the block — the lease came
# right after a block ended, and two reboots in between only restarted the
# wait. With an infinite timeout NetworkManager never gives up on a plugged-in
# cable: the DHCP client keeps sending, the lease lands the moment the server
# answers, and the shell says "Waiting for an address" instead of nothing.
# (The value is NM's own "infinity"; it applies only while a profile leaves
# ipv4.dhcp-timeout at its default 0. Wi-Fi keeps the default — there a timeout
# is what lets NetworkManager move on to the next network.)
[connection-ewe-wired]
match-device=type:ethernet
ipv4.dhcp-timeout=2147483647
