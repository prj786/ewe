# ewe — NetworkManager hands DNS to systemd-resolved (installed by phase 30
# into /etc/NetworkManager/conf.d/). Without it NM writes /etc/resolv.conf
# itself, and the first VPN client that also writes it (Tailscale MagicDNS:
# nameserver 100.100.100.100) owns every lookup — with the VPN down, names
# stop resolving on the home network and only the VPN "works" (dev box,
# 2026-09-25). resolved keeps per-link DNS: LAN, VPN and tailnet side by side.
[main]
dns=systemd-resolved
