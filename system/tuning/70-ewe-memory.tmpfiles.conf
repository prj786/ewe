# ewe — runtime memory switches (systemd-tmpfiles writes them at boot; the
# installer applies them at once). Installed only with zram, like the sysctl
# file beside it.
#
# zswap off: it compresses every page on its way to swap — including the way
# into zram, which compresses it again. The second pass only costs CPU, at
# the moments memory is already tight.
w /sys/module/zswap/parameters/enabled - - - - N
# Transparent huge pages only where a program asks (madvise): "always" let
# browser and Electron heaps grow in 2 MB steps (1.3 GB of huge pages on the
# owner's laptop) and stalls allocations on compaction.
w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
