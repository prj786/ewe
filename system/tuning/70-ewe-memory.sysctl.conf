# ewe — memory tuning for a machine whose first swap is zram (ewe sets zram
# up on every chassis; installed only when /etc/systemd/zram-generator.conf
# exists). Measured on the owner's laptop 2026-11-08: the kernel defaults
# (swappiness 60, page-cluster 3) were still in place next to zram.
#
# swappiness 180: swapping an idle page into compressed RAM is cheaper than
# dropping file cache — the cache that keeps app binaries warm, so a launch
# after memory got tight reads from RAM, not disk (Arch wiki, zram).
vm.swappiness = 180
# zram has no seek cost: reading 8 neighbour pages ahead on every swap-in is
# pure latency
vm.page-cluster = 0
