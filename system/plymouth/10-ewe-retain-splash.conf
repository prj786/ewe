# Installed to /etc/systemd/system/plymouth-quit.service.d/ by ewe phase 35.
#
# Stock plymouth-quit tears the splash down and drops the framebuffer back to
# the text console, so every line the kernel/systemd ever printed flashes up
# between the sheep splash and the greeter — and again on the VT juggling
# right after login. --retain-splash leaves the last splash frame ON the
# framebuffer when plymouthd exits: greetd (ordered After=plymouth-quit-wait)
# then flips straight from the sheep frame to the cage greeter, and the boot
# console text underneath is never exposed. From power-on the eye sees only:
# splash → greeter → welcome animation → desktop.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
