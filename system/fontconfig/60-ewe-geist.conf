<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ewe — installed to /etc/fonts/conf.d/ by phase 30, next to Geist and
     Geist Mono in /usr/share/fonts/ewe. It is for the login greeter, which
     runs as the `greeter` user and never reads the user's fontconfig
     (dotfiles/fontconfig/fonts.conf holds the same two aliases for the
     desktop). Geist has no Georgian glyphs, so Noto Sans Georgian
     (noto-fonts) comes next. Only these two families are touched; the
     system's sans-serif and monospace stay as they are. -->
<fontconfig>
  <alias>
    <family>Geist</family>
    <prefer>
      <family>Geist</family>
      <family>Noto Sans Georgian</family>
    </prefer>
  </alias>
  <alias>
    <family>Geist Mono</family>
    <prefer>
      <family>Geist Mono</family>
      <family>Noto Sans Georgian</family>
    </prefer>
  </alias>
</fontconfig>
