<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ewe — installed to /etc/fonts/conf.d/ by phase 30, next to Geist and
     Geist Mono in /usr/share/fonts/ewe. It is for the login greeter, which
     runs as the `greeter` user and never reads the user's fontconfig
     (dotfiles/fontconfig/fonts.conf holds the same two aliases for the
     desktop). Geist has no Georgian glyphs, so Noto Sans Georgian
     (noto-fonts) comes next, then Noto Sans Arabic UI, Noto Sans Hebrew,
     Noto Sans Armenian and Noto Sans (Arabic drew unjoined in FreeMono
     before), then Source Han Sans for Chinese, Japanese and Korean names
     (adobe-source-han-sans-otc-fonts). Only these two families
     are touched; the system's sans-serif and monospace stay as they are. -->
<fontconfig>
  <alias>
    <family>Geist</family>
    <prefer>
      <family>Geist</family>
      <family>Noto Sans Georgian</family>
      <family>Noto Sans Arabic UI</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Sans Armenian</family>
      <family>Noto Sans</family>
      <family>Source Han Sans SC</family>
    </prefer>
  </alias>
  <alias>
    <family>Geist Mono</family>
    <prefer>
      <family>Geist Mono</family>
      <family>Noto Sans Georgian</family>
      <family>Noto Sans Arabic UI</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Sans Armenian</family>
      <family>Noto Sans</family>
      <family>Source Han Sans SC</family>
    </prefer>
  </alias>
</fontconfig>
