# Installed to /etc/systemd/system/greetd.service.d/ by ewe phase 35.

[Unit]
# Hand off cleanly from the plymouth splash: don't race plymouthd for the
# framebuffer, and don't start until it has actually gone away.
After=plymouth-quit-wait.service plymouth-quit.service
# ── SEAMLESS HANDOFF (2026-09-01, proven on the live ISO) ───────────────────
# config.toml now says `vt = 1`: the greeter takes over the VT plymouth just
# left instead of chvt'ing to a fresh one, so splash → greeter is a single
# cut. That only works if tty1 is greetd's alone — a getty there would flash
# a login prompt + motd on plymouth's VT before cage grabs it. Arch's packaged
# greetd.service already carries this pair; it is repeated here so the design
# does not silently depend on upstream keeping it. The rescue console lives on
# tty3 instead (Ctrl+Alt+F3; getty@tty3 is enabled by phase 30).
Conflicts=getty@tty1.service
After=getty@tty1.service

[Service]
# ── BLACK-SCREEN GUARD (2026-08-25) ─────────────────────────────────────────
# greetd was configured with `vt = "next"` when this was written; it is
# `vt = 1` since 2026-09-01 and the guard is unchanged — greetd still
# activates its VT and cage still has to become DRM master on it, so a held
# framebuffer still hangs the boot. On start greetd takes its VT and blocks
# in VT_WAITACTIVE until the switch completes. If ANY process is still
# holding the DRM framebuffer at that moment, the switch never completes:
# greetd hangs before it even reaches PAM, cage never becomes DRM master, and
# the machine sits on a black screen forever with no way out but the power
# button. In the journal it looks like greetd printing its config dump and
# then falling silent for the rest of the boot.
#
# The classic cause is `plymouth quit --retain-splash`, which keeps the last
# splash frame on screen by handing plymouthd's DRM fds to a
# `plymouthd-fd-escrow` child. That child holds them open indefinitely and,
# being a dumb fd holder, never answers the VT switch. ewe used to install
# exactly that drop-in (see phase 35) — it no longer does, but a stale copy on
# an upgraded machine, a plymouthd that ignored `quit`, or a future distro
# default would bring the hang straight back.
#
# So before greetd is allowed to touch a VT, make certain the framebuffer is
# free. All three are best-effort (`-`) and are silent no-ops on a healthy
# boot, where plymouth-quit-wait has already reaped plymouthd.
ExecStartPre=-/usr/bin/plymouth quit
ExecStartPre=-/usr/bin/pkill -f plymouthd-fd-escrow
ExecStartPre=-/usr/bin/pkill -x plymouthd
