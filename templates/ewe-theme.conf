# ewe-theme.conf — what the looks ARE.
# ===========================================================================
# The single source of truth for every colour and shape in ewe. `ewe-theme
# build` reads this file and generates BOTH halves of the desktop from it:
#
#   ~/.config/quickshell/theme-tokens.json   the shell (Theme.qml reads it)
#   design/tokens.css                        the apps (ewe-settings, ewe-sync,
#                                            komble-arch — compiled in, and
#                                            re-injected at runtime)
#
# So a colour is changed HERE, once, and both halves follow. Nothing below is
# referenced by name in component code: components ask for a role ("dim text",
# "danger") and this file decides what that looks like.
#
# Relationship to ewe.conf (RFC-001): ewe.conf records the machine's STATE,
# including which theme you picked. This file records what those themes ARE —
# shipped definitions, not per-machine state, which is why it is a separate
# document and is not synced between machines.
#
# Adding a look = adding a [<name>] block with the same keys. Nothing in the
# shell or the apps enumerates theme names.
# ---------------------------------------------------------------------------

[meta]
version = 1
default = "flock"

# ===========================================================================
# FLOCK — Bauhaus / neo-brutalist, on a dark ground.
# "Form follows function." Flat colour blocks, no gradients, no soft shadows,
# no glassmorphism. Depth is a solid block offset down-right. Limited palette:
# ink plus one accent per surface.
#
# ewe is dark-only (decision 2026-09-01), so the guide is applied as its
# STRUCTURE inverted onto ink: Bauhaus's #f5f0e8 warm paper becomes the ink
# colour (fg / stroke) rather than the background.
# ===========================================================================
[flock]
label = "Flock"
note = "Bauhaus — bold, raw, unapologetic. Square, thick-ruled, uppercase."

[flock.color]
bg           = "#14140f"   # desktop / app base — warm, because the guide's ground is warm paper
panel        = "#1c1b15"   # popup / panel
elevated     = "#24231b"   # cards / rows
hover        = "#2f2d22"
stroke       = "#f5f0e8"   # Bauhaus DRAWS a shape: the border is the ink, at 3px
fg           = "#f5f0e8"   # the guide's paper colour, inverted into the text role
fg-secondary = "#b8b2a4"
fg-dim       = "#8a8478"
# The guide names exactly three accents and no green, so "positive" is the
# interactive blue. link is what stays legible AS text on ink; link-solid is
# the fill (#0055ff on #14140f is ~2.5:1 — unreadable as text).
success      = "#4d84ff"
warning      = "#ffcc00"
danger       = "#e63b2e"
link         = "#4d84ff"
link-solid   = "#0055ff"
accent-fg    = "#14140f"   # text ON an accent fill; the guide's accents are all bright

[flock.shape]
radius        = 0          # "no border-radius or minimal" — zero, with no exceptions
radius-inner  = 0
radius-pill   = 0
border        = 3          # "thick solid borders (2-3px)"
border-thin   = 2          # dense rows, where 3px would fill the row
shadow-offset = 4          # "offset shadows: solid-color block, 4-6px down-right"

# Used ONLY by `ewe-theme preview` — tokens.css must never define --accent,
# because that is whatever Settings → Theme wrote. This is just what the
# specimen page paints with so the buttons are not colourless.
[flock.preview]
accent = "#ffcc00"

[flock.voice]
label-transform = "uppercase"   # "Buttons: uppercase text"
label-tracking  = "0.06em"
label-weight    = 700
hover           = "invert"      # "Hover = color invert"
input-border    = "bottom"      # "Inputs: thick bottom border only"

# ===========================================================================
# BLACK SHEEP — Alexandria.
# A sophisticated, quiet corporate dark mode: tonal surface layers, hairline
# outlines, soft radii, ambient depth. Sentence case throughout.
# ===========================================================================
[blacksheep]
label = "Black Sheep"
note = "Alexandria — serene, tonal, soft-cornered. For deep-focus work."

[blacksheep.color]
bg           = "#121314"   # surface
panel        = "#1b1c1d"   # surface-container-low
elevated     = "#1f2021"   # surface-container
hover        = "#292a2b"   # surface-container-high
stroke       = "#434653"   # outline-variant — a true hairline
fg           = "#e3e2e3"   # on-surface
fg-secondary = "#c3c6d5"   # on-surface-variant
fg-dim       = "#8d909e"   # outline
# error and tertiary are the guide's; it names no success colour, so this one
# is derived in the same light-desaturated register as its error.
success      = "#a6d6a8"
warning      = "#dcc661"   # tertiary
danger       = "#ffb4ab"   # error
link         = "#b1c5ff"   # primary
link-solid   = "#3366cc"   # primary-container
accent-fg    = "#002c70"   # on-primary

[blacksheep.shape]
radius        = 12         # the guide's own scale: xl 0.75rem
radius-inner  = 8          # lg 0.5rem
radius-pill   = 6          # md 0.375rem
border        = 1
border-thin   = 1
shadow-offset = 0          # 0 = use ambient blur instead of an offset block

[blacksheep.preview]
accent = "#b1c5ff"

[blacksheep.voice]
label-transform = "none"
label-tracking  = "normal"
label-weight    = 500
hover           = "brighten"
input-border    = "all"
